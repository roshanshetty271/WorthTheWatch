name: Backend Tests

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway database for the Postgres-backed tests. No secrets, and the tests
    # themselves make no outbound calls (every external service is faked).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wtw
          POSTGRES_PASSWORD: wtw
          POSTGRES_DB: wtw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wtw -d wtw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q -rs
        env:
          WTW_TEST_DATABASE_URL: postgresql+asyncpg://wtw:wtw@localhost:5432/wtw_test
